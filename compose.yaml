x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ai_agent}
  CONNECTION_ENCRYPTION_KEY: ${CONNECTION_ENCRYPTION_KEY:?Set CONNECTION_ENCRYPTION_KEY in .env}
  FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-6-luna}
  QDRANT_URL: http://qdrant:6333
  TEXT2SQL_COLLECTION: ${TEXT2SQL_COLLECTION:-text2sql_semantics_v1}
  TEXT2SQL_EMBEDDING_MODEL: ${TEXT2SQL_EMBEDDING_MODEL:-openai/text-embedding-3-small}
  TEXT2SQL_EMBEDDING_DIMENSIONS: ${TEXT2SQL_EMBEDDING_DIMENSIONS:-1536}
  SUPERSET_URL: ${SUPERSET_URL:-}
  SUPERSET_USERNAME: ${SUPERSET_USERNAME:-}
  SUPERSET_PASSWORD: ${SUPERSET_PASSWORD:-}
  OWN_KNOWLEDGE_AGENT_KEY: ${OWN_KNOWLEDGE_AGENT_KEY:-}
  OWN_KNOWLEDGE_ADMIN_KEY: ${OWN_KNOWLEDGE_ADMIN_KEY:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_agent}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.1
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      API_URL: http://backend:8000
      OWN_KNOWLEDGE_ADMIN_KEY: ${OWN_KNOWLEDGE_ADMIN_KEY:-}
      OWN_KNOWLEDGE_REVIEW_PASSWORD: ${OWN_KNOWLEDGE_REVIEW_PASSWORD:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  ingestion-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.modules.text2sql.worker"]
    environment:
      <<: *backend-environment
      TEXT2SQL_WORKER_CONCURRENCY: ${TEXT2SQL_WORKER_CONCURRENCY:-4}
      TEXT2SQL_WORKER_POLL_SECONDS: ${TEXT2SQL_WORKER_POLL_SECONDS:-2}
      TEXT2SQL_JOB_MAX_ATTEMPTS: ${TEXT2SQL_JOB_MAX_ATTEMPTS:-3}
      TEXT2SQL_JOB_TIMEOUT_SECONDS: ${TEXT2SQL_JOB_TIMEOUT_SECONDS:-900}
      TEXT2SQL_JOB_RETENTION_DAYS: ${TEXT2SQL_JOB_RETENTION_DAYS:-7}
      TEXT2SQL_TOPIC_INTERVALS: ${TEXT2SQL_TOPIC_INTERVALS:-}
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 90s
    restart: unless-stopped

  warehouse-db:
    image: postgres:16-alpine
    profiles: [simulation]
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-data_wh}
      POSTGRES_USER: ${WAREHOUSE_DB_USER:-bi}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-bi_dev_password}
    ports:
      - "127.0.0.1:${WAREHOUSE_DB_PORT:-15433}:5432"
    volumes:
      - warehouse_db_data:/var/lib/postgresql/data
      - ./simulation/data_wh/scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  airflow:
    build:
      context: ./simulation/airflow
      dockerfile: Dockerfile
    profiles: [simulation]
    command: ["bash", "/opt/airflow-bootstrap.sh"]
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__LOGGING__SYMLINK_LATEST_LOG: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-airflow-secret-change-me}
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
      WAREHOUSE_DB_HOST: warehouse-db
      WAREHOUSE_DB_PORT: 5432
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB:-data_wh}
      WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER:-bi}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-bi_dev_password}
      WEATHER_API_URL: ${WEATHER_API_URL:-https://api.open-meteo.com/v1/forecast}
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-18080}:8080"
    volumes:
      - airflow_home:/opt/airflow
      - ./simulation/airflow/dags:/opt/airflow/dags
      - ./simulation/airflow/logs:/opt/airflow/logs
      - ./simulation/airflow/plugins:/opt/airflow/plugins
    depends_on:
      warehouse-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  warehouse_db_data:
  airflow_home:
