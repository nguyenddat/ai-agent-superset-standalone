        <title id="text2sql-chat-title">Đồ thị LangGraph của một câu hỏi</title>
        <desc id="text2sql-chat-desc">preprocess tách và truy hồi, dispatch gửi từng câu đơn cho agent, câu cần hỏi lại dừng ở clarify, hết câu thì synthesize ghép câu trả lời.</desc>
