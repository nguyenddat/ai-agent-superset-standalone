[project]
name = "ai-agent-superset-standalone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "langchain-openai>=1.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
    "sqlglot>=28.10.1,<29",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-agent-superset-standalone = "backend:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "backend"
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
